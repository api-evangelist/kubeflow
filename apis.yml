aid: kubeflow
name: Kubeflow
description: >-
  Kubeflow is an open-source machine learning platform for Kubernetes,
  designed to make deployments of ML workflows on Kubernetes simple, portable,
  and scalable. It provides tools for training, serving, tuning, and managing
  ML models across the full lifecycle.
